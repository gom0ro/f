<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>С ДНЕМ РОЖДЕНИЯ ФОЙДКА</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Cinzel:wght@400;600&family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --font-serif: 'Bodoni Moda', Georgia, serif;
      --font-display: 'Cinzel', serif;
      --font-sans: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    html::-webkit-scrollbar, body::-webkit-scrollbar {
      display: none;
    }

    body {
      background-color: var(--bg);
      color: #f5f5f5;
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      width: 100%;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .film-grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    .icon {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 1.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: inline-block;
      vertical-align: middle;
    }

    .side-nav {
      position: fixed;
      right: 32px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 100;
    }

    .side-nav-dot {
      width: 5px;
      height: 5px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .side-nav-dot.active {
      background: #ffffff;
      transform: scale(1.6);
      border-color: #ffffff;
    }

    .campaign-slide {
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      text-align: center;
      overflow: hidden;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .slide-bg-num {
      position: absolute;
      font-family: var(--font-display);
      font-size: clamp(100px, 30vw, 420px);
      font-weight: 400;
      color: rgba(255, 255, 255, 0.02);
      z-index: 0;
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    .editorial-content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .hero-title {
      font-family: var(--font-serif);
      font-size: clamp(34px, 8.5vw, 130px);
      line-height: 0.95;
      font-weight: 400;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: #f2f2f2;
      padding: 0 12px;
      max-width: 100%;
    }

    .hero-title .foydka-word {
      font-style: italic;
      font-weight: 500;
      letter-spacing: -0.03em;
      display: block;
      margin-top: 12px;
      color: #ffffff;
    }

    .campaign-title {
      font-family: var(--font-serif);
      font-size: clamp(54px, 15vw, 240px);
      line-height: 0.88;
      font-weight: 400;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: #ffffff;
      white-space: nowrap;
      max-width: 100%;
      transition: transform 0.4s ease;
    }

    .campaign-title-long {
      font-family: var(--font-serif);
      font-size: clamp(36px, 11vw, 200px);
      line-height: 0.9;
      font-weight: 400;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      color: #ffffff;
      white-space: nowrap;
      max-width: 100%;
      transition: transform 0.4s ease;
    }

    .icon-frame {
      width: 60px;
      height: 60px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      background: rgba(255, 255, 255, 0.02);
      transition: all 0.4s ease;
      flex-shrink: 0;
    }

    .icon-frame:hover {
      border-color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      transform: rotate(45deg);
    }

    .icon-frame .icon {
      width: 24px;
      height: 24px;
      stroke: #ffffff;
    }

    .scroll-arrow-box {
      position: absolute;
      bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      text-decoration: none;
      color: #ffffff;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
    }

    .arrow-svg-wrap {
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: floatDown 2.2s infinite ease-in-out;
      background: rgba(10, 10, 10, 0.4);
      backdrop-filter: blur(4px);
    }

    @keyframes floatDown {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }

    @media (max-width: 768px) {
      .side-nav {
        display: none;
      }
      .campaign-slide {
        padding: 20px 16px;
      }
      .icon-frame {
        width: 54px;
        height: 54px;
        margin-bottom: 18px;
      }
      .icon-frame .icon {
        width: 22px;
        height: 22px;
      }
      .arrow-svg-wrap {
        width: 40px;
        height: 40px;
      }
      .hero-title {
        font-size: clamp(30px, 8.5vw, 48px);
      }
      .campaign-title {
        font-size: clamp(48px, 14vw, 76px);
      }
      .campaign-title-long {
        font-size: clamp(32px, 10vw, 56px);
      }
    }
  </style>
</head>
<body>

  <div class="film-grain"></div>

  <aside class="side-nav" id="sideNav"></aside>

  <section class="campaign-slide" id="slide-0">
    <div class="slide-bg-num">00</div>
    <div class="editorial-content">
      <h1 class="hero-title">
        С днем рождения
        <span class="foydka-word">Фойдка</span>
      </h1>
    </div>
    <a href="#slide-1" class="scroll-arrow-box">
      <div class="arrow-svg-wrap">
        <svg class="icon" viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <polyline points="19 12 12 19 5 12"></polyline>
        </svg>
      </div>
    </a>
  </section>

  <section class="campaign-slide" id="slide-1">
    <div class="slide-bg-num">01</div>
    <div class="editorial-content">
      <div class="icon-frame">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path>
        </svg>
      </div>
      <h2 class="campaign-title">ЧОРТ</h2>
    </div>
    <a href="#slide-2" class="scroll-arrow-box">
      <div class="arrow-svg-wrap">
        <svg class="icon" viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <polyline points="19 12 12 19 5 12"></polyline>
        </svg>
      </div>
    </a>
  </section>

  <section class="campaign-slide" id="slide-2">
    <div class="slide-bg-num">02</div>
    <div class="editorial-content">
      <div class="icon-frame">
        <svg class="icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <circle cx="12" cy="12" r="6"></circle>
          <circle cx="12" cy="12" r="2"></circle>
        </svg>
      </div>
      <h2 class="campaign-title">ЛОХ</h2>
    </div>
    <a href="#slide-3" class="scroll-arrow-box">
      <div class="arrow-svg-wrap">
        <svg class="icon" viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <polyline points="19 12 12 19 5 12"></polyline>
        </svg>
      </div>
    </a>
  </section>

  <section class="campaign-slide" id="slide-3">
    <div class="slide-bg-num">03</div>
    <div class="editorial-content">
      <div class="icon-frame">
        <svg class="icon" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="9" y1="21" x2="9" y2="9"></line>
        </svg>
      </div>
      <h2 class="campaign-title">67</h2>
    </div>
    <a href="#slide-4" class="scroll-arrow-box">
      <div class="arrow-svg-wrap">
        <svg class="icon" viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <polyline points="19 12 12 19 5 12"></polyline>
        </svg>
      </div>
    </a>
  </section>

  <section class="campaign-slide" id="slide-4">
    <div class="slide-bg-num">04</div>
    <div class="editorial-content">
      <div class="icon-frame">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"></path>
        </svg>
      </div>
      <h2 class="campaign-title-long">ДУШНИЛА</h2>
    </div>
    <a href="#slide-5" class="scroll-arrow-box">
      <div class="arrow-svg-wrap">
        <svg class="icon" viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <polyline points="19 12 12 19 5 12"></polyline>
        </svg>
      </div>
    </a>
  </section>

  <section class="campaign-slide" id="slide-5">
    <div class="slide-bg-num">05</div>
    <div class="editorial-content">
      <div class="icon-frame">
        <svg class="icon" viewBox="0 0 24 24">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
      </div>
      <h2 class="campaign-title">ЕШОК</h2>
    </div>
    <a href="#slide-6" class="scroll-arrow-box">
      <div class="arrow-svg-wrap">
        <svg class="icon" viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <polyline points="19 12 12 19 5 12"></polyline>
        </svg>
      </div>
    </a>
  </section>

  <section class="campaign-slide" id="slide-6">
    <div class="slide-bg-num">06</div>
    <div class="editorial-content">
      <div class="icon-frame">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
      </div>
      <h2 class="campaign-title-long">КРАСАВЧИК</h2>
    </div>
    <a href="#slide-7" class="scroll-arrow-box">
      <div class="arrow-svg-wrap">
        <svg class="icon" viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <polyline points="19 12 12 19 5 12"></polyline>
        </svg>
      </div>
    </a>
  </section>

  <section class="campaign-slide" id="slide-7">
    <div class="slide-bg-num">07</div>
    <div class="editorial-content">
      <div class="icon-frame">
        <svg class="icon" viewBox="0 0 24 24">
          <polyline points="13 17 18 12 13 7"></polyline>
          <polyline points="6 17 11 12 6 7"></polyline>
        </svg>
      </div>
      <h2 class="campaign-title">ТОРМОЗ</h2>
    </div>
    <a href="#slide-0" class="scroll-arrow-box">
      <div class="arrow-svg-wrap">
        <svg class="icon" viewBox="0 0 24 24">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
      </div>
    </a>
  </section>

  <script>
    const slides = document.querySelectorAll('.campaign-slide');
    const sideNav = document.getElementById('sideNav');

    slides.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'side-nav-dot' + (i === 0 ? ' active' : '');
      dot.onclick = () => slides[i].scrollIntoView({ behavior: 'smooth' });
      sideNav.appendChild(dot);
    });

    const dots = document.querySelectorAll('.side-nav-dot');

    function scrollToSlide(index) {
      slides[index].scrollIntoView({ behavior: 'smooth' });
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const index = Array.from(slides).indexOf(entry.target);
          dots.forEach((d, i) => {
            d.classList.toggle('active', i === index);
          });
        }
      });
    }, { threshold: 0.55 });

    slides.forEach(slide => observer.observe(slide));
  </script>
</body>
</html>
